name: supa_model_school
description: Supa Model School Windows and Android planning scaffold
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Drift 2.31 uses sqlite3 2.x and supports installed Dart 3.9.2.
  # Drift 2.32+ moved to sqlite3 3.x, whose available releases need a newer SDK.
  drift: 2.31.0
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.42
  # Stable Supabase Flutter release supporting Dart 3.9 (no admin/secret keys in clients).
  supabase_flutter: 2.18.3
  # Native Windows/Android document chooser; exact version pinned.
  file_picker: 11.0.3
  # Open expiring private certificate preview links for authorized Principals.
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.31.0
  build_runner: 2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/login/
