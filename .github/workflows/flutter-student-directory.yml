name: Flutter student directory validation
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-student-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-students:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Report resolved dependency lockfile
        run: |
          echo 'PUBSPEC_LOCK_BEGIN'
          base64 -w0 pubspec.lock
          echo
          echo 'PUBSPEC_LOCK_END'
      - name: Dart analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Supabase debug connection and Owner login regression
        run: flutter test test/features/auth/supabase_connection_widget_test.dart test/features/auth/owner_auth_widget_test.dart test/features/auth/login_reference_layout_widget_test.dart
      - name: Student directory widget regression
        run: flutter test test/features/students/student_directory_live_widget_test.dart
      - name: Admissions draft widget regression
        run: flutter test test/features/admissions/admission_live_save_widget_test.dart
      - name: Admissions worklist widget regression
        run: flutter test test/features/admissions/admission_worklist_widget_test.dart
      - name: Admission document upload widget regression
        run: flutter test test/features/admissions/admission_document_upload_widget_test.dart
      - name: Owner submit and Principal approval regressions
        run: flutter test test/features/admissions/admission_submit_widget_test.dart test/features/admissions/principal_approval_widget_test.dart
      - name: Principal login role and secure shell regression
        run: flutter test test/features/auth/principal_auth_widget_test.dart
      - name: Complete Owner admission registry regression
        run: flutter test test/features/admissions/admission_registry_widget_test.dart
