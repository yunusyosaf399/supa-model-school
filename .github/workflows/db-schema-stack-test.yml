name: DB03-DB09 PostgreSQL integration (no deployment)

on:
  push:
    branches:
      - 'test/db03-db09-postgres-ci-20261117'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-schema-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-schema:
    name: Test full schema chain in isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch (no production credentials)
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start isolated local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          if [ ! -f supabase/config.toml ]; then supabase init; fi
          supabase db start
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_isready -h 127.0.0.1 -p 54322 -U postgres
      - name: Run DB03–DB09 SQL DDL and checks (stops on first error)
        shell: bash
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test_schema_stack.sh
      - name: Report test-only boundary
        if: always()
        run: |
          echo "This workflow tests a disposable local PostgreSQL database only."
          echo "No Supabase access tokens or remote DB connection are used."
