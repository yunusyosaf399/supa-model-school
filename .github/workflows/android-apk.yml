name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Only public Flutter client credentials: NEVER use a Supabase secret/service-role key.
      # Optional Actions Variables let the owner select a different public test project.
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uebzvfzpbqqttbqyxxos.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2MHTAn3zzA4b3lr9SIzwHg_t0R3Q9Je' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android release APK for the test school
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify release APK internet permission
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/release-apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/release-apk-permissions.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: supa-model-school-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
