name: Flutter dashboard verification

on:
  push:
    branches:
      - main
      - ui/dashboard-pixel-reference-v2-20261116
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
